plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    compileOnly "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    for (module in ['fabric-api-base', 'fabric-lifecycle-events-v1', 'fabric-key-mapping-api-v1']) {
        implementation fabricApi.module(module, fabric_api_version)
        include fabricApi.module(module, fabric_api_version)
    }
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25; withSourcesJar() }
jar { from('LICENSE', 'THIRD_PARTY.md') }
test { useJUnitPlatform() }

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'cokechat-test'
        enableGameTests = false
        enableClientGameTests = true
        eula = false
    }
}
dependencies { gametestImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}" }
// Optional installed mods for isolated compatibility tests; never packaged in CokeChat.
if (project.hasProperty('commandCompatibilityMods')) {
    dependencies { gametestRuntimeOnly fileTree(dir: project.property('commandCompatibilityMods'), include: ['*.jar']) }
}
tasks.named('runClientGameTest') {
    doFirst {
        copy {
            from 'examples/custom-emojis/CokeChat-Custom'
            into layout.buildDirectory.dir('run/clientGameTest/resourcepacks/CokeChat-Custom')
        }
    }
}
